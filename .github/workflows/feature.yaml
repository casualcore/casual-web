name: Build Casual Web - Alpha
on: 
  push:
    branches:
      - 'feature/**'
      - '!feature/*/main'
      - 'patch/**'
      - '!patch/*/main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: casual-web
          path: ./**/casual-web-*.tgz